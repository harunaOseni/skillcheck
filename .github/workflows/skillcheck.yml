name: skillcheck

# Lint the skill files in this repo for factual drift against the OpenAPI spec,
# the Resend CLI's real command tree, and the live docs.
# Drop this file into resend/resend-skills (or any repo with skills/**/*.md).

on:
  pull_request:
    paths: ["skills/**", ".github/workflows/skillcheck.yml"]
  schedule:
    - cron: "0 14 * * 1" # weekly: docs/OpenAPI drift happens without any skills PR
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Source of truth: the CLI's command definitions (built from source)
      - name: Checkout resend-cli
        uses: actions/checkout@v4
        with:
          repository: resend/resend-cli
          path: .skillcheck/resend-cli

      - name: Install resend-cli deps
        working-directory: .skillcheck/resend-cli
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install skillcheck
        run: npm install -g github:harunaOseni/skillcheck

      # Optional: cached model responses make AI reruns cheap and repeatable
      - uses: actions/cache@v4
        with:
          path: .skillcheck-cache
          key: skillcheck-ai-${{ hashFiles('skills/**') }}
          restore-keys: skillcheck-ai-

      - name: Run skillcheck
        run: |
          # --ai only when the OPENAI_API_KEY secret exists (not set for fork PRs)
          AI=""
          if [ -n "$OPENAI_API_KEY" ]; then AI="--ai"; fi
          skillcheck skills \
            --cli-repo .skillcheck/resend-cli \
            --report skillcheck-report.md \
            --strict $AI
        env:
          RESEND_TELEMETRY_DISABLED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish report to job summary
        if: always()
        run: cat skillcheck-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillcheck-report
          path: skillcheck-report.md
